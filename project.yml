name: NPMUI
options:
  bundleIdPrefix: com.souvickghosh
  deploymentTarget:
    macOS: "13.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.1.0
targets:
  NPMUI:
    type: application
    platform: macOS
    sources:
      - path: NPMUI
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p360.npmPackageInspector
        DEVELOPMENT_TEAM: WWH3E79388
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NPMUI/Info.plist
      properties:
        CFBundleDisplayName: Package Inspector
        CFBundleName: Package Inspector
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: NPMUI/NPMUI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
schemes:
  NPMUI:
    build:
      targets:
        NPMUI: all
    run:
      config: Debug
    archive:
      config: Release
